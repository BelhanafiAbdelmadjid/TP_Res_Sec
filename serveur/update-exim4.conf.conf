# Fichier lu par update-exim4.conf pour generer
# /var/lib/exim4/config.autogenerated.
# Equivalent non interactif de : dpkg-reconfigure exim4-config

dc_eximconfig_configtype='internet'

# Domaines pour lesquels ce serveur est final. Un RCPT TO vers un de ces
# domaines declenche une livraison locale, pas un relais.
dc_other_hostnames='mail.tp.local;serveur;localhost'

# Point b. de l'enonce : ajouter l'interface reseau connectee.
# 0.0.0.0 = toutes les interfaces IPv4, donc aussi celle du bridge Docker.
# Le defaut Debian est 127.0.0.1, et avec ce defaut le client ne voit rien.
dc_local_interfaces='0.0.0.0'

dc_readhost=''
dc_relay_domains=''
dc_minimaldns='false'

# Reseau autorise a relayer. Valeur de repli, ecrasee au demarrage par
# la variable RELAY_NETS pour rester alignee sur le .env.
# L'elargir a 0.0.0.0/0 transforme le serveur en relais ouvert.
dc_relay_nets='10.99.0.0/24'

dc_smarthost=''
CFILEMODE='644'
dc_use_split_config='false'
dc_hide_mailname='false'
dc_mailname_in_oh='true'

# Livraison locale en mbox dans /var/mail/<user>. Dovecot lira au meme endroit.
dc_localdelivery='mail_spool'