# Charge apres les fichiers 10-* de Debian, donc ces valeurs gagnent.
# Tout est volontairement en clair, c'est l'objet du TP.

protocols = pop3
listen = *

# Pas de TLS. Le trafic doit rester lisible dans Wireshark.
ssl = no

# Ces deux lignes vident les chemins definis dans 10-ssl.conf.
# Le prefixe < de Debian fait lire le fichier au moment de l'analyse de la
# configuration, avant meme que ssl = no soit pris en compte. Si le certificat
# auto signe n'a pas ete genere a l'installation, Dovecot s'arrete la.
ssl_cert =
ssl_key =

disable_plaintext_auth = no
auth_mechanisms = plain login

# exim4 livre en mbox dans /var/mail/<user> avec dc_localdelivery='mail_spool'.
# Sans cette ligne Dovecot cherche en Maildir et annonce une boite vide.
mail_location = mbox:~/mail:INBOX=/var/mail/%u
mail_privileged_group = mail

# Un seul ecouteur POP3, en clair. Le bloc pop3s de 10-master.conf est
# neutralise avec port = 0 pour eviter qu'il reclame un certificat.
service pop3-login {
  inet_listener pop3s {
    port = 0
  }
}

# Journal dans un vrai fichier. L'entrypoint le diffuse ensuite vers la sortie
# du conteneur avec tail -F. Ecrire directement dans /dev/stderr parait pratique
# mais Dovecot n'arrive pas toujours a l'ouvrir, et il s'arrete alors en
# ecrivant le message dans le fichier qu'il ne peut pas ouvrir.
log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot.log
debug_log_path = /var/log/dovecot.log

